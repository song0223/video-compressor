name: Build

on:
  push:
    branches: [main, feature/mvp]
    tags:
      - "v*"
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install FFmpeg
        run: brew install ffmpeg
      - name: Prepare bundled FFmpeg
        run: bash scripts/prepare-local-ffmpeg.sh
      - name: Install dependencies
        run: npm ci
      - name: Test frontend
        run: npm test -- --run
      - name: Test Rust
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Build app
        run: npm run tauri build
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: video-compressor-macos
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app

  build-windows:
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install FFmpeg
        shell: pwsh
        run: choco install ffmpeg -y
      - name: Prepare bundled FFmpeg
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force src-tauri/binaries/windows | Out-Null
          $ffmpeg = (Get-Command ffmpeg).Source
          $ffprobe = (Get-Command ffprobe).Source
          Copy-Item $ffmpeg src-tauri/binaries/windows/ffmpeg.exe -Force
          Copy-Item $ffprobe src-tauri/binaries/windows/ffprobe.exe -Force
      - name: Install dependencies
        run: npm ci
      - name: Test frontend
        run: npm test -- --run
      - name: Test Rust
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Build app
        run: npm run tauri -- build --bundles nsis
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: compression-toolbox-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7.0.0
        with:
          path: release-assets
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG_NAME#v}"
          mkdir -p release-files

          mapfile -d '' built_assets < <(find release-assets -type f \( -name "*.dmg" -o -name "*.exe" \) -print0)
          for asset in "${built_assets[@]}"; do
            case "$asset" in
              *.dmg)
                cp "$asset" "release-files/compression-toolbox_${version}_aarch64.dmg"
                ;;
              *setup.exe)
                cp "$asset" "release-files/compression-toolbox_${version}_x64-setup.exe"
                ;;
              *.exe)
                cp "$asset" "release-files/compression-toolbox_${version}_x64.exe"
                ;;
            esac
          done

          mapfile -d '' assets < <(find release-files -type f -print0)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "No release assets found"
            exit 1
          fi

          title="压缩工具箱 $version"
          if gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG_NAME" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --title "$title" --notes "Release $title"
          fi
