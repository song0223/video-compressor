name: Build

on:
  push:
    branches: [main, feature/mvp]
  pull_request:
    branches: [main]

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install FFmpeg
        run: brew install ffmpeg
      - name: Prepare bundled FFmpeg
        run: bash scripts/prepare-local-ffmpeg.sh
      - name: Install dependencies
        run: npm ci
      - name: Test frontend
        run: npm test -- --run
      - name: Test Rust
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Build app
        run: npm run tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: video-compressor-macos
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install FFmpeg
        shell: pwsh
        run: choco install ffmpeg -y
      - name: Prepare bundled FFmpeg
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force src-tauri/binaries/windows | Out-Null
          $ffmpeg = (Get-Command ffmpeg).Source
          $ffprobe = (Get-Command ffprobe).Source
          Copy-Item $ffmpeg src-tauri/binaries/windows/ffmpeg.exe -Force
          Copy-Item $ffprobe src-tauri/binaries/windows/ffprobe.exe -Force
      - name: Install dependencies
        run: npm ci
      - name: Test frontend
        run: npm test -- --run
      - name: Test Rust
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Build app
        run: npm run tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: video-compressor-windows
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
